name: Verify simplified V3 production
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose public demo
        shell: bash
        run: |
          set -euo pipefail
          url='https://nanny-youpiii-v3.vercel.app/demo?role=nanny&section=shopping'
          code="$(curl -sS -L --max-time 20 -o /tmp/page.html -w '%{http_code}' "$url")"
          echo "HTTP=$code"
          echo '--- visible text markers ---'
          sed 's/<[^>]*>/ /g' /tmp/page.html | tr -s ' ' | head -c 4000
          echo
          test "$code" = '200'
          grep -Fq 'Courses & caisse' /tmp/page.html
          grep -Fq 'Acheté' /tmp/page.html
