name: Nanny Youpiii V3 CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Inspect Neon Auth verification APIs
        run: |
          echo '--- auth-ui email otp references ---'
          grep -RniE 'email-otp|verify.*email|verification.*email|otp' node_modules/@neondatabase/auth-ui node_modules/@neondatabase/auth 2>/dev/null | head -160 || true
          echo '--- auth client types ---'
          grep -RniE 'emailOtp|verifyEmail|sendVerification|verification' node_modules/@neondatabase/auth 2>/dev/null | head -160 || true
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
