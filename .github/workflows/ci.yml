name: Verify Nanny Youpiii production OTP
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check production verification screen
        env:
          BASE_URL: https://nanny-youpiii-v3.vercel.app
        run: |
          code=000
          for attempt in $(seq 1 24); do
            code=$(curl -L -sS -o /tmp/verify.html -w '%{http_code}' --max-time 15 "$BASE_URL/verify-email?email=test%40example.com" || true)
            echo "attempt=$attempt status=$code"
            if [ "$code" = "200" ] && grep -qi 'Vérifiez votre e-mail' /tmp/verify.html; then
              echo 'OTP verification screen is live.'
              exit 0
            fi
            sleep 10
          done
          echo 'Production did not expose the new OTP screen.'
          grep -Eio '<title>[^<]*</title>|Nanny Youpiii[^<]*|Vérifiez votre e-mail|Email verification|required' /tmp/verify.html | head -20 || true
          exit 1
