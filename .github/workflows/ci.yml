name: Nanny Youpiii V3 CI
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Pack validated source
        run: tar --exclude=.git --exclude=node_modules --exclude=.next -czf /tmp/nanny-youpiii-v3-source.tgz .
      - name: Upload validated source
        uses: actions/upload-artifact@v4
        with:
          name: nanny-youpiii-v3-source
          path: /tmp/nanny-youpiii-v3-source.tgz
          retention-days: 1
