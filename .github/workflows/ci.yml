name: Vercel preview diagnostic
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect preview response
        env:
          PREVIEW_URL: https://nanny-youpiii-v3-b9o1p6dxq-appdevs-projects-d796a91e.vercel.app
        run: |
          curl -L -sS -D /tmp/headers.txt -o /tmp/body.html --max-time 20 "$PREVIEW_URL/"
          echo '--- headers ---'
          cat /tmp/headers.txt
          echo '--- title ---'
          grep -Eio '<title>[^<]*</title>' /tmp/body.html | head -1 || true
          echo '--- body preview ---'
          head -c 2500 /tmp/body.html
          echo
