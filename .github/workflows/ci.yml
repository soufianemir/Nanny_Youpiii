name: Verify Nanny Youpiii production OTP
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check production verification screen
        env:
          BASE_URL: https://nanny-youpiii-v3.vercel.app
        run: |
          set -e
          code=$(curl -L -sS -o /tmp/verify.html -w '%{http_code}' --max-time 20 "$BASE_URL/verify-email?email=test%40example.com")
          echo "status=$code"
          test "$code" = "200"
          grep -qi 'Vérifiez votre e-mail' /tmp/verify.html
          echo 'OTP verification screen is live.'
