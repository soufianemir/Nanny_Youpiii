name: Vercel production diagnostic
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect public production response
        env:
          PROD_URL: https://nanny-youpiii-v3-appdevs-projects-d796a91e.vercel.app
        run: |
          curl -L -sS -D /tmp/headers.txt -o /tmp/body.html --max-time 20 "$PROD_URL/"
          echo '--- headers ---'
          cat /tmp/headers.txt
          echo '--- title ---'
          grep -Eio '<title>[^<]*</title>' /tmp/body.html | head -1 || true
          echo '--- markers ---'
          grep -Eio 'Nanny Youpiii[^<]*|Configuration manquante|DATABASE_URL|Login – Vercel' /tmp/body.html | head -20 || true
          echo '--- body preview ---'
          head -c 3000 /tmp/body.html
          echo
