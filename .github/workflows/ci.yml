name: Nanny Youpiii V3 CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Inspect Neon Auth OTP signup flow
        run: |
          echo '--- provider docs ---'
          sed -n '370,430p' node_modules/@neondatabase/auth-ui/llms.txt || true
          echo '--- README emailOTP ---'
          sed -n '60,110p' node_modules/@neondatabase/auth-ui/README.md || true
          sed -n '210,250p' node_modules/@neondatabase/auth-ui/README.md || true
          echo '--- SignUpForm implementation ---'
          grep -n 'function SignUpForm' node_modules/@neondatabase/auth-ui/dist/index.mjs || true
          START=$(grep -n 'function SignUpForm' node_modules/@neondatabase/auth-ui/dist/index.mjs | head -1 | cut -d: -f1 || true)
          if [ -n "$START" ]; then END=$((START+260)); sed -n "${START},${END}p" node_modules/@neondatabase/auth-ui/dist/index.mjs; fi
          echo '--- EmailOTP implementation ---'
          sed -n '8840,9015p' node_modules/@neondatabase/auth-ui/dist/index.mjs || true
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
