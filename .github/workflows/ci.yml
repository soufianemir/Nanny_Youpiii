name: Nanny Youpiii V3 CI
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: Export Drizzle DDL
        run: |
          rm -rf drizzle
          npx drizzle-kit generate --config=drizzle.config.ts
          echo '===NANNY_SCHEMA_SQL_BEGIN==='
          cat drizzle/*.sql
          echo '===NANNY_SCHEMA_SQL_END==='
      - run: npm run build
