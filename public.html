<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f5ef" />
  <meta name="description" content="Nanny Youpiii — toute la journée de l'enfant, sans avoir à demander." />
  <title>Nanny Youpiii</title>
  <link rel="icon" href="https://raw.githack.com/soufianemir/Nanny_Youpiii/main/assets/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://raw.githack.com/soufianemir/Nanny_Youpiii/main/styles.css" />
  <script>
    (() => {
      const base = 'https://raw.githack.com/soufianemir/Nanny_Youpiii/main';
      const fix = (node) => {
        if (!node || node.nodeType !== 1) return;
        const imgs = node.matches?.('img') ? [node] : [...(node.querySelectorAll?.('img') || [])];
        imgs.forEach((img) => {
          const src = img.getAttribute('src');
          if (src && src.startsWith('/assets/')) img.src = base + src;
        });
      };
      new MutationObserver((mutations) => mutations.forEach((m) => m.addedNodes.forEach(fix)))
        .observe(document.documentElement, { childList: true, subtree: true });
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="sheet-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <script type="module" src="https://raw.githack.com/soufianemir/Nanny_Youpiii/main/js/app.js"></script>
</body>
</html>
